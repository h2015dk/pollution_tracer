name: Update MOENV stationary sources

# 每週更新環境部空污列管公私場所清單（EMS_S_01，含 WGS84 座標）→ data/moenv_sources.csv.gz
on:
  workflow_dispatch:
  schedule:
    - cron: "43 18 * * 0"   # 每週一 02:43（臺北時間）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: python scripts/build_moenv_sources.py data/moenv_sources.csv.gz
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/moenv_sources.csv.gz data/moenv_sources.meta.json
          git commit -m "Update MOENV stationary sources" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
