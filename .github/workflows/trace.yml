name: Pollution Source Trace

on:
  workflow_dispatch:
    inputs:
      lat:
        description: "緯度 (WGS84)"
        required: true
        default: "25.0800"
      lon:
        description: "經度 (WGS84)"
        required: true
        default: "121.5800"
      time:
        description: "時間 (台北時間) 例 2026-11-22 14:00"
        required: true
      radius_km:
        description: "搜尋半徑 (km)"
        default: "10"
      window_hours:
        description: "往前回溯小時數"
        default: "24"
      wind_radius_km:
        description: "採用測站風向的距離上限 (km)"
        default: "5"
      cwa_radius_km:
        description: "氣象署有人站：上限內沒有時，取此距離內最近一站 (km)"
        default: "15"
      wind_dir:
        description: "（選填）手動風向°（風吹來的方向）；空白則自動：環境部/氣象署測站→Open-Meteo 模式"
        default: ""
      wind_speed:
        description: "（選填）手動風速 m/s"
        default: ""

permissions:
  contents: write   # 推送 gh-pages 分支

concurrency:
  group: gh-pages   # 同時多次執行時依序推送，避免互相覆蓋
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # OSM 查詢結果快取（固定設施變動慢；Overpass 常 502/逾時）
      - uses: actions/cache@v4
        with:
          path: cache/osm
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: Run trace
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          T: ${{ inputs.time }}
          R: ${{ inputs.radius_km }}
          W: ${{ inputs.window_hours }}
          WD: ${{ inputs.wind_dir }}
          WS: ${{ inputs.wind_speed }}
          WRAD: ${{ inputs.wind_radius_km }}
          CRAD: ${{ inputs.cwa_radius_km }}
          MAP_URL: ${{ env.PAGES_BASE }}/runs/${{ github.run_id }}/map.html
          SEARCH_INDEX_URL: ${{ env.PAGES_BASE }}/search/index.json
        run: |
          EXTRA=()
          if [ -n "$WD" ]; then EXTRA+=(--wind-dir "$WD" --wind-speed "${WS:-0}"); fi
          python trace.py --lat "$LAT" --lon "$LON" --time "$T" --radius "$R" --window-hours "$W" --wind-radius "${WRAD:-5}" --cwa-radius "${CRAD:-15}" --out output "${EXTRA[@]}"
          cat output/summary.md >> "$GITHUB_STEP_SUMMARY"

      # ---- 發布到 GitHub Pages（gh-pages 分支，保留歷次結果）
      - name: Check gh-pages branch
        id: gp
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"   # 第一次執行
          fi
      - name: Checkout gh-pages
        if: steps.gp.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Publish run to gh-pages
        run: |
          mkdir -p site/runs/${{ github.run_id }}
          cp -r output/. site/runs/${{ github.run_id }}/
          # 固定網址：latest/ 永遠是最新一次結果（README 連這裡）
          rm -rf site/latest && mkdir -p site/latest && cp -r output/. site/latest/
          python scripts/build_index.py site
          python scripts/build_search_index.py site/search/index.json   # 地圖搜尋框用的全臺清單
          touch site/.nojekyll
          cd site
          if [ ! -d .git ]; then
            git init -q -b gh-pages
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "trace run ${{ github.run_id }}"
          for i in 1 2 3; do git push origin gh-pages && break; git pull --rebase -q origin gh-pages || true; sleep 5; done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🗺️ 互動地圖（Pages 部署約需 1–2 分鐘）：$PAGES_BASE/runs/${{ github.run_id }}/map.html" >> "$GITHUB_STEP_SUMMARY"
          echo "📋 歷次紀錄：$PAGES_BASE/" >> "$GITHUB_STEP_SUMMARY"
          echo "🆕 最新結果（固定網址）：$PAGES_BASE/latest/map.html" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4   # 備份；公司擋下載時改用上面的 Pages 網址
        with:
          name: pollution-trace-${{ github.run_id }}
          path: output/
